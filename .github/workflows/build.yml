name: Build
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify Meshy pine LOD assets
        run: |
          for lod in 0 1 2; do
            file="public/assets/models/trees/pine_01_lod${lod}.glb"
            test -s "$file"
            test "$(head -c 7 "$file")" != "version"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
